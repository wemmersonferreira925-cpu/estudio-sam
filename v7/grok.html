<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam Studio v7 · Grok</title>
<style>
html,body{margin:0;height:100%;background:#0e1316;color:#e9f1f4;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{max-width:560px;margin:40px auto;padding:22px;border:1px solid #233038;border-radius:14px;background:#151c20}
h1{font-size:20px;margin:0 0 6px}.mut{color:#8fa2ab;font-size:13px}
a.btn{display:inline-block;margin-top:14px;background:#FFD21F;color:#111;font-weight:800;text-decoration:none;padding:10px 16px;border-radius:10px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0e1316}
</style>
</head>
<body>
<div class="box" id="box">
  <h1>Sam Studio v7</h1>
  <div class="mut" id="st">Carregando o estúdio…</div>
  <a class="btn" id="abrir" target="_blank" rel="noopener" style="display:none">Abrir este episódio no estúdio (nova aba)</a>
</div>
<script>
// O Grok troca SÓ o que está entre /*ROTEIRO*/ e /*FIM*/ pelo roteiro do episódio (JSON v7).
const ROTEIRO = /*ROTEIRO*/null/*FIM*/;
const STUDIO = 'https://wemmersonferreira925-cpu.github.io/estudio-sam/v7/';
const $ = id => document.getElementById(id);
const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
async function link() {
  if (!ROTEIRO) return STUDIO;
  const bytes = new TextEncoder().encode(JSON.stringify(ROTEIRO));
  try { const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')); return STUDIO + '#r=z' + b64u(new Uint8Array(await new Response(cs).arrayBuffer())); }
  catch (e) { return STUDIO + '#r=j' + b64u(bytes); }
}
(async () => {
  const url = await link(); const a = $('abrir'); a.href = url; a.style.display = 'inline-block';
  // 1º jeito: baixa o estúdio e roda aqui mesmo, dentro da prévia do Grok
  try {
    const r = await fetch(STUDIO + 'index.html', { cache: 'no-cache' }); if (!r.ok) throw new Error('HTTP ' + r.status);
    let html = await r.text();
    const injeta = '<script>window.__ROTEIRO__=' + JSON.stringify(ROTEIRO).replace(/</g, '\\u003c') + ';<\/script>';
    html = html.replace('<head>', '<head>' + injeta);
    document.open(); document.write(html); document.close(); return;
  } catch (e) { $('st').textContent = 'Abrindo o estúdio numa moldura…'; }
  // 2º jeito: moldura com o estúdio do GitHub
  try { const f = document.createElement('iframe'); f.allow = 'autoplay; clipboard-write'; f.src = url; document.body.appendChild(f);
    setTimeout(() => { $('st').textContent = 'Se o estúdio não apareceu, use o botão abaixo.'; }, 4000); }
  catch (e) { $('st').textContent = 'A prévia bloqueou o estúdio. Use o botão abaixo.'; }
})();
</script>
</body>
</html>
