const STUDIO = 'https://wemmersonferreira925-cpu.github.io/estudio-sam/v7/';
const $ = id => document.getElementById(id);
const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
async function link() {
  if (!ROTEIRO) return STUDIO;
  const bytes = new TextEncoder().encode(JSON.stringify(ROTEIRO));
  try { const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')); return STUDIO + '#r=z' + b64u(new Uint8Array(await new Response(cs).arrayBuffer())); }
  catch (e) { return STUDIO + '#r=j' + b64u(bytes); }
}

  const url = await link(); const a = $('abrir'); a.href = url; a.style.display = 'inline-block';
  // 1º jeito: baixa o estúdio e roda aqui mesmo, dentro da prévia do Grok
  try {
    const r = await fetch(STUDIO + 'index.html', { cache: 'no-cache' }); if (!r.ok) throw new Error('HTTP ' + r.status);

    const injeta = '<script>window.__ROTEIRO__=' + JSON.stringify(ROTEIRO).replace(/</g, '\\u003c') + ';<\/script>';
    html = html.replace('<head>', '<head>' + injeta);
